<!-- Main HTML code file for my study app -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Study Beats - Personal Study Session Planner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="welcome-screen">
            <h1 id="appName">Study Beats!</h1>
            <h2 id="appTargetLine">Your focus, your music, your pace.</h2>
            <p id="appSummary">
                Create customized playlists, import your favorite
                study music, and set timers to keep you on task
                along with a few breaks here and there. Structure
                personalized study sessions with StudyBeats.
            </p>
            <button class="get-started" id="getStarted">Get Started</button>
            <div class="welcome-modal" id="welcomeModal">
                <div class="welcome-modal-content">
                    <h2>Welcome to StudyBeats!</h2>
                </div>
                <button class="close-message" id="closeMessage">Close Message</button>
            </div>
            <div class="main-modal" id="mainModal">
                <div class="main-modal-content">
                    <h1>Study Playlists</h1>
                    <div id="playlists"></div> <!-- New playlists will appear here -->
                    <button class="create-playlist" id="createPlaylist">Create Playlist</button>
                    <form id="playlistForm">
                        <input type="text" id="playlistInput" placeholder="Playlist Name">
                        <button type="submit" id="playlistFormSubmit">Submit</button>
                    </form>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
